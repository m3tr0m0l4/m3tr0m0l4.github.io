<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Gmail_icon_%282020%29.svg/512px-Gmail_icon_%282020%29.svg.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unblocked Library</title>

  <style>
    body { margin: 10px; line-height: 1.25; max-width: 760px; }
    body.dark { background: #0b0f14; color: #e6edf3; }
    body.dark a { color: #8ab4ff; }
    body.dark input,
    body.dark button { background: #111823; color: #e6edf3; border: 1px solid #2a3441; }
    body.dark .msgs { border-color: #2a3441 !important; }

    .tab { display: none; }
    .tab.active { display: block; }

    .tabs { margin: 4px 0 6px; }
    .tabs button { padding: 2px 6px; }

    .home-block { margin-top: 10px; }
    .status-line { margin: 2px 0; }
    .quick-links { margin-top: 6px; }
    .quick-links a { display: block; }

    h2 { margin: 6px 0 4px; font-size: 24px; }
    p { margin: 0; }
    h3 { margin: 0; font-size: 18px; }

    #about a,
    #gameList a { line-height: 1.1; }

    .news-item { border: 1px solid #ccc; padding: 6px 8px; margin-top: 6px; }
    .news-date { font-size: 12px; opacity: 0.8; }
    body.dark .news-item { border-color: #2a3441; background: #111823; }

    .faq-item { margin: 10px 0; }
    .faq-item div { font-size: 13px; }

    /* STATUS COLORS */
    .status-online { color: #2ecc71; }
    .status-offline { color: #e74c3c; }
    .status-unstable { color: #f1c40f; }

    body.dark .status-online { color: #4cd964; }
    body.dark .status-offline { color: #ff6b6b; }
    body.dark .status-unstable { color: #ffd93d; }
  </style>
</head>

<body>

<h1>unblocked library</h1>

<label><input type="checkbox" id="themeToggle"> dark mode</label>

<div class="tabs">
<button data-tab="about">home</button><button data-tab="arcade">arcade</button><button data-tab="flash">flash</button><button data-tab="html5">html5</button><button data-tab="chat">chat</button><button data-tab="requests">requests & faq</button>
</div>

<!-- HOME -->
<div id="about" class="tab active">

  <div class="home-block">
    <h2>status</h2>
    <div class="status-line"><b>proxy:</b> <span id="proxyStatus"> </span></div>
    <div class="status-line"><b>chat:</b> <span id="chatStatus"> </span></div>
  </div>

  <div class="home-block quick-links">
    <h2>quick links</h2>
    <div id="quickLinks"> </div>
  </div>

  <div class="home-block">
    <h2>news</h2>
    <div id="newsList"> </div>
  </div>

</div>

<!-- HTML5 -->
<div id="html5" class="tab">
  <input id="search" placeholder="search html5 games">
  <div id="gameList">(loading)</div>
</div>

<!-- REQUESTS -->
<div id="requests" class="tab">
  <p><a href="https://forms.gle/LjYg4BHPPaZuewUg6">request form (anonymous)</a></p>
  <h3>faq</h3>
  <div id="faqList"></div>
</div>

<script>
(function(){

/* ---------- tabs ---------- */
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>{
    t.className = t.id===id ? 'tab active' : 'tab';
    t.style.display = t.id===id ? 'block' : 'none';
  });
}
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>switchTab(b.dataset.tab);
});

/* ---------- theme ---------- */
const toggle = document.getElementById('themeToggle');
function applyTheme(on){
  document.body.classList.toggle('dark',on);
  localStorage.setItem('d',on?'1':'0');
  toggle.checked=on;
}
applyTheme(localStorage.getItem('d')==='1');
toggle.onchange=()=>applyTheme(toggle.checked);

/* ---------- status ---------- */
function applyStatus(id,obj){
  const el=document.getElementById(id);
  if(!el||!obj)return;

  el.className='';

  if(obj.online===true){
    el.classList.add('status-online');
    el.textContent='online';
  }
  else if(obj.online==='unstable'){
    el.classList.add('status-unstable');
    el.textContent=obj.message ? 'unstable, '+obj.message : 'unstable';
  }
  else{
    el.classList.add('status-offline');
    el.textContent=obj.message ? 'offline, '+obj.message : 'offline';
  }
}

fetch('/status.json')
.then(r=>r.json())
.then(d=>{
  applyStatus('proxyStatus',d.proxy);
  applyStatus('chatStatus',d.chat);
})
.catch(()=>{});

/* ---------- news ---------- */
fetch('/news.json')
.then(r=>r.json())
.then(items=>{
  const list=document.getElementById('newsList');
  list.innerHTML='';
  items.forEach(n=>{
    const box=document.createElement('div');
    box.className='news-item';
    box.innerHTML=
      `<div class="news-date">${n.date}</div>
       <div><b>${n.title}</b></div>
       <div>${n.text}</div>`;
    list.appendChild(box);
  });
});

/* ---------- quick links ---------- */
fetch('/quicklinks.json')
.then(r=>r.json())
.then(items=>{
  const el=document.getElementById('quickLinks');
  el.innerHTML='';
  items.forEach(i=>{
    const a=document.createElement('a');
    a.href=i.href;
    a.textContent=i.label;
    el.appendChild(a);
  });
});

/* ---------- games ---------- */
fetch('/games.json')
.then(r=>r.json())
.then(items=>{
  const el=document.getElementById('gameList');
  el.innerHTML='';
  items.forEach((g,i)=>{
    const a=document.createElement('a');
    a.href=g.href;
    a.textContent=g.label;
    el.appendChild(a);
    if(i<items.length-1)el.appendChild(document.createElement('br'));
  });
});

/* ---------- search ---------- */
document.getElementById('search').oninput=function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('#gameList a').forEach(a=>{
    a.style.display=a.textContent.toLowerCase().includes(q)?'':'none';
  });
};

/* ---------- faq ---------- */
fetch('/faq.json')
.then(r=>r.json())
.then(items=>{
  const el=document.getElementById('faqList');
  el.innerHTML='';
  items.forEach(i=>{
    const d=document.createElement('div');
    d.className='faq-item';
    d.innerHTML=`<b>Q:</b> ${i.q}<br><b>A:</b> ${i.a}`;
    el.appendChild(d);
  });
})
.catch(()=>{
  document.getElementById('faqList').textContent='(nothing yet)';
});

})();
</script>

</body>
</html>
